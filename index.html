}
function termsFor(qv){
 const raw=String(qv||'').trim().toLowerCase();
 const n=norm(raw);
 let terms=[n];
 for(const key in aliases){
   if(n===norm(key)) terms=terms.concat(aliases[key].map(norm));
 }
 return [...new Set(terms.filter(Boolean))];
}

const q=document.getElementById('q');
const list=document.getElementById('list');
const count=document.getElementById('count');

function render(){
 const terms=termsFor(q.value);
 const found=!terms.length ? data : data.filter(x=>{
   const s=searchable(x);
   return terms.some(t=>s.includes(t));
 });
 count.textContent=terms.length ? `${found.length}টি ফলাফল পাওয়া গেছে` : `মোট ${data.length}টি শাখা/এজেন্ট`;
 list.innerHTML=found.length ? found.map(x=>`<div class="card">
   <div class="name">${x.n}. ${x.name}</div>
   <div class="meta">${x.div} বিভাগ</div>
   <div class="addr">${x.addr}</div>
   <div class="phone">☎ ${x.phone}</div>
 </div>`).join('') : '<div class="empty">কোনো মিল পাওয়া যায়নি।<br>জেলা, উপজেলা, শাখার নাম বা ফোন নম্বর দিয়ে চেষ্টা করুন।</div>';
}
q.addEventListener('input',render);
q.addEventListener('search',render);
render();
</script>

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
